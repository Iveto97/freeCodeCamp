<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Palindrome Checker</title>
</head>

<body>
  <div class="header">
    Is it a palindrome?
  </div>

  <form>
    <div class="input-container">
      <div class="input-field">
        <input type="text" id="text-input" class="input-text" />
        <label for="text-input">Enter in text to check for a palindrome:</label>
      </div>
      <button id="check-btn" class="check-btn">Check</button>
      <div id="result"></div>
    </div>
  </form>

  <div class="info-container">
    <h1>What is a palindrome?</h1>
    <span class="solution"><img src="./solution.png" alt=""></span>
    <p>A palindrome is a word, sentence, verse, or even number that reads the same backward or forward. It derives from
      Greek roots that literally mean “running back”.</p>
  </div>

  <script src="./script.js"></script>
</body>

</html>
