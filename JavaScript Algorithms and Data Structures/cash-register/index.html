<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cash Register</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header id="project-header">
        <h1>Cash Register Project</h1>
        <div>
            <button id="open-cash-re-btn" class="open-btn btn-style" type="button">Open</button>
        </div>
    </header>

    <main id="app-container">
        <h1>Cash Register Project</h1>

        <section class="cash-program">
            <div>
                <button id="close-btn" class="close"><i class="fa-solid fa-x mark"></i></button>
            </div>
            <div class="row">
                <div class="column">
                    <div>
                        <div class="screen">
                            <span id="change-due" class="due"></span>
                        </div>
                        <div class="input-container">
                            <h4>Enter cash from customer:</h4>
                            <input id="cash" class="customer-amount" type="number">
                            <button id="purchase-btn" class="purchase-bth">Purchase</button>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="btn-line">
                        <div class="keyboard">
                            <button id="keyboard-btn" class="keyboard-btn">7</button>
                            <button id="keyboard-btn" class="keyboard-btn">8</button>
                            <button id="keyboard-btn" class="keyboard-btn">9</button>
                            <button id="delete-btn" class="keyboard-btn"><i
                                    class="fa-solid fa-delete-left"></i></button>
                        </div>
                        <div class="keyboard">
                            <button id="keyboard-btn" class="keyboard-btn">4</button>
                            <button id="keyboard-btn" class="keyboard-btn">5</button>
                            <button id="keyboard-btn" class="keyboard-btn">6</button>
                            <button id="keyboard-btn" class="keyboard-btn">0</button>
                        </div>
                        <div class="keyboard">
                            <button id="keyboard-btn" class="keyboard-btn">1</button>
                            <button id="keyboard-btn" class="keyboard-btn">2</button>
                            <button id="keyboard-btn" class="keyboard-btn">3</button>
                            <button id="keyboard-btn" class="keyboard-btn">.</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
