<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <title>Real Time Counter</title>
</head>

<body>
    <main>
        <div class="counter-container">
            <h1 class="title">Real-Time Character Counter</h1>
            <p class="description">Type something in the box below to see your character count in real time.</p>

            <textarea class="text" id="text-input" name="textarea" maxlength="50" rows="10" placeholder="Write here..."></textarea>

            <div class="cards-container">
                <div class="card blue">
                    <p id="char-count">Character Count: <span>0</span></p>
                </div>
                <div class="card pink">
                     <p id="char-remaining">Characters    Remaining <span>50</span></p>
                </div>
            </div>
            <p class="max">Maximum characters: 50</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>


</html>
