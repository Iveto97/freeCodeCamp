<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />

    <title>Telephone Number Validator</title>
</head>

<body>
    <header class="main-text">
        <h1 class="title">Telephone Number Validator</h1>
        <p class="description">
            Enter a phone number to check if it would be correct number or not.
        </p>
    </header>

    <main>
        <label class="user-input-label" for="user-input" >Enter a Phone Number Here:</label>
        <input id="user-input" class="user-input">
        <button id="check-btn" class="btns">Check</button>
        <button id="clear-btn" class="btns">Clear</button>
        <div id="results-div" class="result"> </div>
    </main>

    <script src="./script.js"> </script>
</body>

</html>
